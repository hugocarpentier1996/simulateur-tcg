services:
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
    working_dir: /workspace
    init: true
    ports:
      - '127.0.0.1:5173:5173'
    volumes:
      - .:/workspace
      - dependencies:/workspace/node_modules
      - pnpm-store:/pnpm/store
    environment:
      PNPM_HOME: /pnpm
    command: sh -c "pnpm install --frozen-lockfile --store-dir /pnpm/store && pnpm test:watch"

volumes:
  dependencies:
  pnpm-store:
